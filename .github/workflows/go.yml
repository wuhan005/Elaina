name: Go
on:
  push:
    branches: [ master ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/download-wasm.sh'
      - 'scripts/build-wasm-go.sh'
      - 'tools/wasm-go/**'
      - 'tools/wasm-c/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/download-wasm.sh'
      - 'scripts/build-wasm-go.sh'
      - 'tools/wasm-go/**'
      - 'tools/wasm-c/**'
      - '.github/workflows/go.yml'
env:
  GOPROXY: "https://proxy.golang.org"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Create frontend dist folder
        run: mkdir -p web/dist && touch web/dist/1
      - name: Install WASM interpreters and C toolchain
        run: ./scripts/download-wasm.sh
      - name: Build Go WASM toolchain
        run: ./scripts/build-wasm-go.sh
      - name: Run tests
        run: go test ./... -timeout 5m
      - name: Run WASM integration tests without elevated privileges
        run: WASM_TEST_DIR="$PWD/.wasm" go test ./internal/runtime -v -timeout 10m

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create frontend dist folder
        run: mkdir -p web/dist && touch web/dist/1
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: --timeout=10m
      - name: Check Go module tidiness
        shell: bash
        run: |
          go mod tidy
          (cd tools/wasm-go && go mod tidy && go test ./...)
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "Unstaged files:"
            echo "$STATUS"
            echo "Run 'go mod tidy' commit them"
            exit 1
          fi
